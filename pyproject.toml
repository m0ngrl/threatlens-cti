[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatlens-cti"
version = "0.1.0"
description = "Extract and assess indicators of compromise from cyber threat intelligence reports."
readme = "README.md"
requires-python = ">=3.12"
# AGPL because PyMuPDF, a required dependency, is AGPL-3.0 (or commercial).
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Tyler Passey" },
    { name = "Ben King" },
    { name = "Ethan McLachlan" },
]
keywords = [
    "cybersecurity",
    "threat-intelligence",
    "cti",
    "ioc",
    "stix",
    "ollama",
    "llm",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymupdf>=1.24",
    "platformdirs>=3.0",
]

[project.urls]
Homepage = "https://github.com/m0ngrl/threatlens-cti"
Documentation = "https://github.com/m0ngrl/threatlens-cti/tree/main/src/threatlens/docs"
Source = "https://github.com/m0ngrl/threatlens-cti"
Issues = "https://github.com/m0ngrl/threatlens-cti/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.12",
    "mypy>=1.16",
    "twine>=6.0",
]
dashboard = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "datasette>=0.65",
]

[project.scripts]
threatlens = "threatlens.cli:main"
threatlens-dashboard = "threatlens.dashboard.server:main"
threatlens-ingest = "threatlens.dashboard.ingest_worker:cli_main"
threatlens-calibrate = "threatlens.extractors.calibration:main"
threatlens-init = "threatlens.setup_wizard:main"

[tool.setuptools.packages.find]
where = ["src"]

# Non-Python files the installed package needs: the dashboard's pages and
# static assets, the documentation it serves at /docs, and the Alembic
# template used by `alembic revision`. (Migration scripts are .py modules in
# threatlens.migrations, so they ship as code.)
[tool.setuptools.package-data]
threatlens = [
    "dashboard/*.html",
    "dashboard/static/**/*",
    "docs/*.html",
    "migrations/README",
    "migrations/script.py.mako",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
